# Types des colonnes de datas/releves_incidents.csv
# Types autorisés : IDENTITY, BOOLEAN, INTEGER, FLOAT, DATE, DATETIME, TIME, CATEGORY, TEXT
#   IDENTITY  identifiant / clé (pas de statistiques)
#   INTEGER, FLOAT            -> min, max, moyenne, médiane
#   DATE, DATETIME, TIME      -> min, max
#   BOOLEAN, CATEGORY, TEXT   -> pas de statistiques
# Une colonne absente de ce fichier est typée par inférence automatique.

source: releves_incidents.csv

columns:
  incident_id: IDENTITY
  date: DATE
  time: TIME
  operator_name: CATEGORY
  machine_id: IDENTITY
  severity: INTEGER
  operator_badge: IDENTITY
  comment: TEXT
  shift: CATEGORY
  type_surchauffe: BOOLEAN
  type_baisse_pression: BOOLEAN
  type_vibration: BOOLEAN
  type_bruit_mecanique: BOOLEAN
  type_surconsommation: BOOLEAN
  type_blocage_mecanique: BOOLEAN
  type_alarme_capteur: BOOLEAN
  type_arret_urgence: BOOLEAN
  type_defaut_qualite: BOOLEAN
